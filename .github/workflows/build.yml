name: Build SomeVer

on:
  push:
    branches:
      - main
  pull_request:

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  NUGET_XMLDOC_MODE: skip

jobs:
  build:
    name: Build
    runs-on: windows-2022
    permissions:
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          filter: tree:0

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6.0.0
        with:
          global-json-file: global.json

      - name: Test MinVer
        shell: cmd
        run: dotnet test .\MinVerTests.Lib\ -c Release --disable-build-servers

      - name: Build SomeVer
        shell: cmd
        run: dotnet build .\SomeVer\ -c Release -nologo --disable-build-servers

      - name: Upload NuGet packages
        uses: actions/upload-artifact@v7.0.2
        with:
          name: artifacts
          path: ./**/*.nupkg

      - name: Push to GitHub Packages
        if: github.event_name == 'push' && github.repository_owner == 'robmen' && github.ref == 'refs/heads/main'
        run: dotnet nuget push **/*.nupkg --source https://nuget.pkg.github.com/robmen/index.json --api-key ${{ secrets.GITHUB_TOKEN }} --skip-duplicate
