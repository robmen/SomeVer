name: release
on:
  push:
    tags:
      - v*

permissions: read-all

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  NUGET_XMLDOC_MODE: skip

jobs:
  release:
    name: Release
    runs-on: windows-2022
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          filter: tree:0

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6.0.0
        with:
          global-json-file: global.json

      - name: Test MinVer
        shell: cmd
        run: dotnet test .\MinVerTests.Lib\ -c Release --disable-build-servers

      - name: Build SomeVer
        shell: cmd
        run: dotnet build .\SomeVer\ -c Release -nologo --disable-build-servers

      - name: Upload NuGet packages
        uses: actions/upload-artifact@v7.0.2
        with:
          name: artifacts
          path: ./**/*.nupkg

      - name: NuGet login (OIDC)
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: robmen

      - name: Push to NuGet.org
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push **/*.nupkg --source https://api.nuget.org/v3/index.json --api-key $env:NUGET_API_KEY
